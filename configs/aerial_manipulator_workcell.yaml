task: aerial_pick_place
scene: aerial_manipulator_workcell
planner: aerial_manipulator_minco
controller: cascaded
control_dt: 0.01
visualize: true
wind: none

pick_place:
  position_tolerance: 0.02
  velocity_tolerance: 0.05
  angular_velocity_tolerance: 0.2
  settle_time: 0.30

aerial_manipulator_minco:
  # ===== Objective =====
  # Prefer smooth, trackable motion over aggressive time minimization.
  jerk_weights: [1.0, 1.0, 1.0, 1.0, 0.2, 0.2, 0.2, 0.2]
  time_weight: 3.0

  # ===== Dynamic Constraints =====
  max_speed: 5.0
  max_acceleration: 5.0
  max_body_rate: 2.1
  max_yaw_rate: 1.2
  max_yaw_acceleration: 2.5
  joint_velocity_limits: [2.0, 2.0, 2.0, 2.0]
  joint_acceleration_limits: [4.0, 4.0, 4.0, 4.0]

  # ===== Collision & Penalties =====
  obstacle_clearance: 0.05
  rrt_obstacle_margin: 0.05
  esdf_discretization_margin: 0.035
  esdf_resolution: 0.02
  self_clearance: 0.0

  obstacle_weight: 10000.0
  self_collision_weight: 1000.0
  constraint_weight: 5000.0
  smoothing_epsilon: 0.005

  # ===== MINCO =====
  minco_sample_spacing_m: 1.5
  # Fixed-initialization benchmark: four intervals, 30 iterations, under 3 s.
  integral_resolution: 4
  integral_resolution_floor_unloaded: 2
  integral_resolution_floor_loaded: 2
  minimum_total_time: 0.15
  initial_duration_scale: 1.2

  # ===== L-BFGS =====
  # One joint solve; numerical convergence is reported independently.
  max_iterations: 30
  lbfgs_memory: 12
  gradient_tolerance: 0.8
  relative_cost_tolerance: 0.001
  optimizer_waypoint_step_scale: 0.05

  # ===== Variable Parameterization =====
  position_scale: 0.5
  yaw_scale: 0.7
  joint_scales: [0.8, 0.8, 0.8, 0.8]
  joint_waypoint_parameterization: tanh

  # ===== A* Guidance =====
  astar_guidance_enabled: true
  astar_grid_resolution: 0.08
  astar_fallback_grid_resolution: 0.04
  astar_clearance_weight_m: 0.10
  astar_clearance_offset_m: 0.05
  astar_heuristic_weight: 2.0
  astar_guide_sample_spacing_m: 0.10
  astar_tube_std_m: 0.10

  # ===== RRT =====
  rrt_step_size: 1.0
  rrt_joint_sampling_padding_rad: 1.3
  rrt_simplify_attempts: 64
  rrt_simplify_budget_s: 0.05

  # ===== Collision Validation =====
  edge_position_resolution: 0.04
  edge_yaw_resolution: 0.08
  edge_joint_resolution: 0.08
  validation_dt: 0.025
