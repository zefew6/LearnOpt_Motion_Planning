mode: train
scene:
  config: ../scenes/open_field.yaml
task:
  name: trajectory_tracking
  reference:
    source: trajectory_bank
    path: ../../runs/ppo_trajectory/multitraj01/trajectory_bank
    split: train
  initialization:
    source: reference
    perturb: true
  success:
    position_tolerance_m: 0.5
agent:
  type: rl
  policy: acmpc
  device: cuda
  mpc:
    horizon_steps: 20
    iterations: 1
    retry_iterations: 1
    tolerance: 0.0001
    chunk_size: 16
    terminal_scale: 4.0
disturbance:
  wind:
    type: random_gust
    parameters:
      probability: 0.5
      steady_horizontal_max: 1.0
      gust_horizontal_max: 0.5
      gust_vertical_max: 0.1
      angular_frequency_min: 0.3
      angular_frequency_max: 1.5
execution:
  action_dt: 0.01
  seed: 42
  episodes: 1
  max_steps: 100000
training:
  total_timesteps: 10000000
  n_envs: 24
  torch_threads: 1
  evaluation_interval: 100000
  checkpoint_interval: 250000
  evaluation:
    panel_size: 2
    perturb_initial_state: true
  curriculum:
    wind_fraction: 0.3
  ppo:
    n_steps: 4096
    batch_size: 4096
    n_epochs: 10
    gamma: 0.995
    gae_lambda: 0.95
    learning_rate_start: 0.0003
    learning_rate_end: 0.00003
    clip_range: 0.2
    ent_coef: 0.001
    max_grad_norm: 0.5
    net_arch:
      pi: [512, 512]
      vf: [512, 512]
output:
  directory: ../../runs/experiments/acmpc_open_field
  viewer: false
  record: false
  planning_visualization: false
