# Large PPO-MLP gate-racing run. Start with a new run directory per seed.
task: gate_racing
scene: gate_racing
course:
  mode: random
policy_type: mlp
device: cuda
seed: 42
n_envs: 16
total_timesteps: 10000000
steps_per_action: 10
episode_seconds: 30.0
evaluation_episodes: 50
evaluation_interval: 100000
checkpoint_interval: 500000
torch_threads: 4
ppo:
  n_steps: 1024
  batch_size: 1024
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate_start: 0.0003
  learning_rate_end: 0.00003
  clip_range: 0.2
  ent_coef: 0.001
  max_grad_norm: 0.5
  activation: relu
  net_arch:
    pi: [512, 512]
    vf: [512, 512]
