# Isolated pure-UAV deployment of the pinned official YOPO-MINCO network.
task: yopo_navigation
scene: uav_yopo_bamboo
planner: yopo
controller: cascaded
control_dt: 0.02
duration: 120.0
visualize: true
follow_camera: true
wind: none
yopo_uav:
  checkpoint: ../../runs/yopo_uav/official_minco_v1
  device: cuda
  velocity: 5.0
  replan_dt: 1.0
  planning_timeout: 1.0
  max_plan_age: 0.5
  goal_tolerance: 0.5
