# Experimental primitive_v4 pilot; not a validated navigation policy.
task: whole_body_planning
scene: whole_body_dense_outdoor
planner: yopo
controller: cascaded
control_dt: 0.01
duration: 180.0
visualize: true
follow_camera: true
wind: none
yopo:
  checkpoint: ../../runs/yopo_whole_body/p4_primitive_v4_pilot_seed23/last
  device: cpu
  speed_scale: 1.0  # baseline timing; 1.3 amplified jerk in the current checkpoint
  gripper_tolerance: 0.002  # fixed command; measured soft-equality servo deviation, metres
whole_body:
  replan_dt: 0.2
  planning_timeout: 1.0
  max_plan_age: 0.5
