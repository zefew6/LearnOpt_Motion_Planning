# CUDA-trained primitive_goal_v5; best offline checkpoint, for online testing.
task: whole_body_planning
scene: whole_body_dense_outdoor
planner: yopo
controller: cascaded
control_dt: 0.01
duration: 180.0
visualize: true
follow_camera: true
wind: none
yopo:
  checkpoint: ../../runs/yopo_whole_body/cuda_scale_v1/formal_cuda/best_17000
