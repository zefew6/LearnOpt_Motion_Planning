[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LearnOpt-Motion-Planning"
version = "0.1.0"
description = "3D UAV simulation and autonomous control: RRT* path planning, minimum snap trajectories and a cascaded flight controller"
requires-python = ">=3.13,<3.14"
dependencies = [
    "casadi>=3.8.0",
    "cvxpy>=1.9.1",
    "mujoco>=3.3.7",
    "numpy>=2.3.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
rl = [
    "gymnasium>=0.29.1,<1.3",
    "PyYAML>=6.0",
    "stable-baselines3==2.8.0",
    "tensorboard>=2.18",
    "torch==2.6.0",
]

[tool.setuptools.packages.find]
include = ["uav_ac*"]

[tool.setuptools.package-data]
uav_ac = [
    "config.ini",
    "simulation/models/*.xml",
]
