[build-system]
requires = ["setuptools>=68", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "LearnOpt-Motion-Planning"
version = "0.1.0"
description = "3D UAV simulation and autonomous control: RRT* path planning, minimum snap trajectories and a cascaded flight controller"
requires-python = ">=3.13,<3.14"
dependencies = [
    "casadi>=3.8.0",
    "cvxpy>=1.9.1",
    "Deprecated>=1.2.18",
    "edt==3.1.2",
    "gymnasium>=0.29.1,<1.3",
    "mujoco>=3.3.7",
    "numpy>=2.3.4",
    "ompl==2.0.1",
    "pathfinding3d==0.7.2",
    "pillow>=11.0",
    "PyYAML>=6.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "scipy>=1.18.1",
    "stable-baselines3==2.8.0",
    "tensorboard>=2.18",
    "torch==2.6.0",
]

[tool.setuptools.packages.find]
include = ["uav_ac*"]

[tool.setuptools.package-data]
uav_ac = [
    "planning/native/*.pyx",
    "simulation/models/*.xml",
    "simulation/model/*.xml",
    "rl/acmpc/vendor/LICENSE.mit",
    "rl/acmpc/vendor/SOURCE.md",
    "yopo/vendor/yopo_minco/LICENSE*",
    "yopo/vendor/yopo_minco/provenance.json",
    "yopo/vendor/yopo_minco/SOURCE.md",
    "yopo/vendor/yopo_minco/config/*.yaml",
    "yopo/vendor/yopo_simulator/CMakeLists.txt",
    "yopo/vendor/yopo_simulator/LICENSE",
    "yopo/vendor/yopo_simulator/SOURCE.md",
    "yopo/vendor/yopo_simulator/provenance.json",
    "yopo/vendor/yopo_simulator/assets/*.ply",
    "yopo/vendor/yopo_simulator/include/*.hpp",
    "yopo/vendor/yopo_simulator/include/*.cuh",
    "yopo/vendor/yopo_simulator/include/cuda_toolkit/*",
    "yopo/vendor/yopo_simulator/include/simsense/*.h",
    "yopo/vendor/yopo_simulator/src/*.cpp",
    "yopo/vendor/yopo_simulator/src/*.cu",
    "yopo/vendor/yopo_simulator/src/simsense/*.cu",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=uav_ac --cov-config=pyproject.toml --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/main.py",
    "*/control/mpc_controller.py",
    "*/record_experiments.py",
    "*/simulation/recording.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
